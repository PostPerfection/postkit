[package]
name = "postkit"
version = "0.6.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Shared library for DCP Wizard, IMF Wizard, and DCP Doctor"

[dependencies]
allsorts = "0.17"
ar-reshaper = "1.5"
asdcplib = { git = "https://github.com/PostPerfection/asdcplib-rs.git", rev = "c8c24cc2d3ed4d22460b744e55b0b840ed98cbfa" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cpal = { version = "0.15", optional = true }
cosmic-text = { version = "0.17", default-features = false, features = ["std", "swash"] }
dirs = "6"
dolby_vision = { version = "3.4", features = ["xml"] }
ebur128 = "0.1.10"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "filter"] }
grokj2k-sys = { git = "https://github.com/GrokImageCompression/grok.git", tag = "v20.4.3", optional = true }
hevc_parser = "0.6"
hex = "0.4"
hound = "3.5.1"
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
jiff = "0.2"
lcms2 = { version = "6", optional = true }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls", "ring", "webpki-roots"] }
libc = "0.2"
png = "0.18"
quick-xml = "0.37"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
regex = "1"
ring = "0.17"
roxmltree = "0.21"
rsa = { version = "0.9", features = ["getrandom"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
# sftp for tms upload. 0.9.6 is the first release whose vendored libssh2 carries
# the CVE-2026-55200 fix, so do not float below it.
ssh2 = { version = "0.9.6", optional = true }
suppaftp = { version = "10", optional = true }
tempfile = "3"
thiserror = "2"
tiff = "0.9"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "fs"], optional = true }
tracing = "0.1"
unicode-bidi = "0.3"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"], optional = true }
url = { version = "2", optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = { version = "0.16", features = ["verify"] }
zeroize = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
pkg-config = "0.3"
postkit-ffmpeg-link-search = { path = "ffmpeg-link-search" }

[features]
default = []
async = ["dep:tokio"]
grok-ffi = ["dep:grokj2k-sys", "dep:cpal"]
grok-gpu = ["grok-ffi"]
flm-exchange = ["dep:rustls", "dep:ureq", "dep:url"]
icc = ["dep:lcms2"]
libmpv = []
tms = ["dep:ssh2", "dep:suppaftp"]

[dev-dependencies]
asdcplib = { git = "https://github.com/PostPerfection/asdcplib-rs.git", rev = "c8c24cc2d3ed4d22460b744e55b0b840ed98cbfa" }
skrifa = "0.45"
# the tms config file is the app's to read; these tests stand in for one
toml = "1"

[[bin]]
name = "bench_j2k"
required-features = ["grok-ffi"]

[[test]]
name = "mxf_wrap_memory"
required-features = ["grok-ffi"]

[[test]]
name = "dolby_compliance"
required-features = ["grok-ffi"]

[[test]]
name = "grok_decode"
required-features = ["grok-ffi"]

[[test]]
name = "dcp_preview"
required-features = ["grok-ffi"]

[[test]]
name = "imf_preview"
required-features = ["grok-ffi"]

[[test]]
name = "video_encode_e2e"
required-features = ["grok-ffi"]

[[test]]
name = "subtitle_burn_e2e"
required-features = ["grok-ffi"]

[[test]]
name = "picture_processing_e2e"
required-features = ["grok-ffi"]

[[test]]
name = "jpeg_sequence_e2e"
required-features = ["grok-ffi"]

[[test]]
name = "overlapped_wrap_e2e"
required-features = ["grok-ffi"]

[[test]]
name = "imf_encode"
required-features = ["grok-ffi"]

[[test]]
name = "app2e_conformance"
required-features = ["grok-ffi"]

[[test]]
name = "in_process_decode_memory"
required-features = ["grok-ffi"]

[[test]]
name = "grok_gpu"
required-features = ["grok-gpu"]

[[test]]
name = "grok_gpu_yuv"
required-features = ["grok-gpu"]

[[test]]
name = "grok_gpu_rgb48le"
required-features = ["grok-gpu"]
