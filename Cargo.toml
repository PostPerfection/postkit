[package]
name = "postkit"
version = "0.6.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Shared library for DCP Wizard, IMF Wizard, and DCP Doctor"

[dependencies]
allsorts = "0.17"
ar-reshaper = "1.5"
asdcplib = { git = "https://github.com/PostPerfection/asdcplib-rs.git", rev = "ff29a31" }
base64 = "0.22"
chrono = "0.4"
cosmic-text = { version = "0.17", default-features = false, features = ["std", "swash"] }
dirs = "6"
dolby_vision = { version = "3.3.2", features = ["xml"] }
ebur128 = "0.1.10"
grokj2k-sys = { git = "https://github.com/GrokImageCompression/grok.git", tag = "v20.3.12", optional = true }
hex = "0.4"
hound = "3.5.1"
lcms2 = { version = "6", optional = true }
libc = "0.2"
notify = "8"
png = "0.18"
quick-xml = "0.37"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
regex = "1"
ring = "0.17"
rsa = { version = "0.9", features = ["getrandom"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
# sftp for tms upload. 0.9.6 is the first release whose vendored libssh2 carries
# the CVE-2026-55200 fix, so do not float below it.
ssh2 = { version = "0.9.6", optional = true }
suppaftp = { version = "10", optional = true }
tempfile = "3"
thiserror = "2"
tiff = "0.9"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "fs"], optional = true }
tracing = "0.1"
unicode-bidi = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = { version = "0.16", features = ["verify"] }
zeroize = "1"

[build-dependencies]
pkg-config = "0.3"

[features]
default = []
async = ["dep:tokio"]
grok-ffi = ["dep:grokj2k-sys"]
icc = ["dep:lcms2"]
libmpv = []
tms = ["dep:ssh2", "dep:suppaftp"]

[dev-dependencies]
asdcplib = { git = "https://github.com/PostPerfection/asdcplib-rs.git", rev = "ff29a31" }
skrifa = "0.45"
# the tms config file is the app's to read; these tests stand in for one
toml = "1"

[[bin]]
name = "bench_j2k"
required-features = ["grok-ffi"]

[[test]]
name = "grok_decode"
required-features = ["grok-ffi"]

[[test]]
name = "dcp_preview"
required-features = ["grok-ffi"]

[[test]]
name = "video_encode_e2e"
required-features = ["grok-ffi"]

[[test]]
name = "subtitle_burn_e2e"
required-features = ["grok-ffi"]

[[test]]
name = "picture_processing_e2e"
required-features = ["grok-ffi"]

[[test]]
name = "jpeg_sequence_e2e"
required-features = ["grok-ffi"]

[[test]]
name = "overlapped_wrap_e2e"
required-features = ["grok-ffi"]

[[test]]
name = "imf_encode"
required-features = ["grok-ffi"]
