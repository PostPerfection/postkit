name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            grok-features: async grok-ffi libmpv
          - os: macos-latest
            grok-features: async grok-ffi
          - os: windows-latest
            grok-features: async grok-ffi
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libxerces-c-dev xmlsec1 libxml2-utils libmpv-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl xerces-c ffmpeg
          echo "OPENSSL_DIR=$(brew --prefix openssl)" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$(brew --prefix xerces-c):$(brew --prefix openssl)" >> $GITHUB_ENV

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-27-16-45/ffmpeg-n8.1.2-47-g156bb4d299-linux64-gpl-8.1.tar.xz
          tar -xJf ffmpeg.tar.xz
          echo "$PWD/ffmpeg-n8.1.2-47-g156bb4d299-linux64-gpl-8.1/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-27-16-45/ffmpeg-n8.1.2-47-g156bb4d299-win64-gpl-8.1.zip
          unzip -q ffmpeg.zip
          echo "$(cygpath -w "$PWD/ffmpeg-n8.1.2-47-g156bb4d299-win64-gpl-8.1/bin")" >> "$GITHUB_PATH"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          # vcpkg reads curl 56 and 503 off github's archive host as permanent and
          # refuses to retry the source download, so retry the whole install
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install xerces-c:x64-windows openssl:x64-windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }
        shell: pwsh

      - name: Set vcpkg env (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup grok
        uses: PostPerfection/setup-grok@v1
        with:
          grok-ref: v20.4.0

      - name: Check test tools
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          grk_compress -h > /dev/null
          grk_decompress -h > /dev/null
          # no xmllint on the windows runner and no test reaches it there
          if [ "$RUNNER_OS" != Windows ]; then
            xmllint --version
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            pkg-config --modversion mpv
          fi

      - name: Build
        run: cargo build --features "async tms"

      - name: Test
        run: cargo test --features "async tms"

      - name: Clippy
        run: cargo clippy --all-targets --features "async tms" -- -D warnings

      - name: Build (grok-ffi)
        run: cargo build --features "${{ matrix.grok-features }}"

      - name: Test (grok-ffi)
        run: cargo test --features "${{ matrix.grok-features }}"

      - name: Clippy (grok-ffi)
        run: cargo clippy --all-targets --features "${{ matrix.grok-features }}" -- -D warnings

      - name: Format check
        run: cargo fmt -- --check
