name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            grok-features: async grok-ffi libmpv
          - os: macos-latest
            grok-features: async grok-ffi libmpv
          - os: windows-latest
            grok-features: async grok-ffi libmpv
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libxerces-c-dev xmlsec1 libxml2-utils fonts-dejavu-core

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl xerces-c xmlsec1
          echo "OPENSSL_DIR=$(brew --prefix openssl)" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$(brew --prefix xerces-c):$(brew --prefix openssl)" >> $GITHUB_ENV

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: ffmpeg
          create-args: ffmpeg=8.1.1=gpl_h4b93310_102
          init-shell: none

      - name: Put ffmpeg on PATH (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "$(dirname "$("${MAMBA_EXE:-micromamba}" run -n ffmpeg which ffmpeg)")" >> "$GITHUB_PATH"

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-27-16-45/ffmpeg-n8.1.2-47-g156bb4d299-linux64-gpl-8.1.tar.xz
          tar -xJf ffmpeg.tar.xz
          echo "$PWD/ffmpeg-n8.1.2-47-g156bb4d299-linux64-gpl-8.1/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-27-16-45/ffmpeg-n8.1.2-47-g156bb4d299-win64-gpl-8.1.zip
          unzip -q ffmpeg.zip
          echo "$(cygpath -w "$PWD/ffmpeg-n8.1.2-47-g156bb4d299-win64-gpl-8.1/bin")" >> "$GITHUB_PATH"

      - name: Install xmlsec1 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          /c/msys64/usr/bin/pacman.exe -Sy --noconfirm --needed mingw-w64-x86_64-xmlsec
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          # vcpkg reads curl 56 and 503 off github's archive host as permanent and
          # refuses to retry the source download, so retry the whole install
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install xerces-c:x64-windows openssl:x64-windows 'libxml2[tools]:x64-windows'
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }
        shell: pwsh

      - name: Set vcpkg env (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
          $installed = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          echo "$installed\tools\libxml2" >> $env:GITHUB_PATH
          echo "$installed\bin" >> $env:GITHUB_PATH

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup grok
        uses: PostPerfection/setup-grok@v1
        with:
          grok-ref: v20.4.0

      - name: Setup libmpv
        uses: PostPerfection/setup-libmpv@v1
        with:
          mpv-release: 20260828
          mpv-archive: mpv-dev-x86_64-20260828-git-182fa6ca49.7z

      - name: Check test tools
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          grk_compress -h > /dev/null
          grk_decompress -h > /dev/null
          xmllint --version
          xmlsec1 --version
          if [ "$RUNNER_OS" = Windows ]; then
            # no pkg-config for mpv there, build.rs reads this instead
            test -n "${MPV_LIB_DIR:-}"
          else
            pkg-config --modversion mpv
          fi

      - name: Build
        run: cargo build --features "async tms"

      - name: Test
        run: cargo test --no-fail-fast --features "async tms"

      - name: Clippy
        run: cargo clippy --all-targets --features "async tms" -- -D warnings

      - name: Build (grok-ffi)
        run: cargo build --features "${{ matrix.grok-features }}"

      - name: 4K decode under ASan (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          unset CMAKE_TOOLCHAIN_FILE VCPKG_ROOT
          prefix="$RUNNER_TEMP/grok-asan"
          git clone --depth 1 --recurse-submodules --shallow-submodules --branch v20.4.0 \
            https://github.com/GrokImageCompression/grok.git "$RUNNER_TEMP/grok-asan-src"
          cmake -S "$RUNNER_TEMP/grok-asan-src" -B "$RUNNER_TEMP/grok-asan-build" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGRK_ENABLE_ASAN=ON \
            -DCMAKE_INSTALL_PREFIX="$prefix" -DGRK_BUILD_CORE_SWIG_BINDINGS=OFF
          cmake --build "$RUNNER_TEMP/grok-asan-build" --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install "$RUNNER_TEMP/grok-asan-build"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig:$prefix/lib64/pkgconfig"
          export DYLD_LIBRARY_PATH="$prefix/lib:$prefix/lib64"
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          bin=$(cargo test --features "${{ matrix.grok-features }}" --lib --no-run --message-format=json 2>/dev/null | jq -r 'select(.executable != null and .target.name == "postkit") | .executable')
          echo "test binary: $bin"
          otool -L "$bin" | grep -i grok
          tests="a_4k_fixture_decodes_reduced a_4k_fixture_decodes_on_one_thread a_4k_fixture_decodes_on_the_shared_pool a_4k_codestream_decodes_back_at_full_resolution"
          for t in $tests; do
            echo "===== asan: $t ====="
            "$bin" "$t" --test-threads=1 2>&1 | tail -120 || true
          done
          for t in $tests; do
            echo "===== lldb: $t ====="
            lldb --batch -o "run" -k "bt all" -k "quit" -- "$bin" "$t" --test-threads=1 2>&1 | grep -v "postkit-\|std::\|core::\|libsystem\|libc++\|dyld" | tail -60 || true
          done

      - name: Test (grok-ffi)
        run: cargo test --no-fail-fast --features "${{ matrix.grok-features }}"

      - name: Clippy (grok-ffi)
        run: cargo clippy --all-targets --features "${{ matrix.grok-features }}" -- -D warnings

      - name: Format check
        run: cargo fmt -- --check
