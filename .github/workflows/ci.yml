name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            grok-features: async grok-ffi libmpv
          - os: macos-latest
            grok-features: async grok-ffi libmpv
          - os: windows-latest
            grok-features: async grok-ffi libmpv
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libxerces-c-dev xmlsec1 libxml2-utils fonts-dejavu-core

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl xerces-c xmlsec1
          echo "OPENSSL_DIR=$(brew --prefix openssl)" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$(brew --prefix xerces-c):$(brew --prefix openssl)" >> $GITHUB_ENV

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # conda-forge and homebrew build ffmpeg without libzimg, and the hdr decode chain needs zscale
        run: |
          base=https://ffmpeg.martin-riedl.de/download/macos/arm64/1787073674_9.0.1
          mkdir -p "$HOME/ffmpeg-bin"
          for tool in ffmpeg ffprobe; do
            curl -fsSL --retry 5 --retry-all-errors -o "$tool.zip" "$base/$tool.zip"
            unzip -q -o "$tool.zip" -d "$HOME/ffmpeg-bin"
            chmod +x "$HOME/ffmpeg-bin/$tool"
          done
          shasum -a 256 -c <<'SUMS'
          8287a1b2229e05eb41859f073e18e6c52c60a778f2f5e6881070fe51b79407fe  ffmpeg.zip
          102a26b8940a053298d9929bfaae71e4b6ef65ba5f19a99a88c433108560741a  ffprobe.zip
          SUMS
          echo "$HOME/ffmpeg-bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          tar -xJf ffmpeg.tar.xz
          echo "$PWD/$(ls -d ffmpeg-*linux64-gpl-8.1)/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip
          unzip -q ffmpeg.zip
          echo "$(cygpath -w "$PWD/$(ls -d ffmpeg-*win64-gpl-8.1)/bin")" >> "$GITHUB_PATH"

      - name: Install xmlsec1 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # a slow msys2 mirror fails the whole install, so retry it
          for attempt in 1 2 3 4 5; do
            /c/msys64/usr/bin/pacman.exe -Sy --noconfirm --needed mingw-w64-x86_64-xmlsec && break
            if [ "$attempt" -eq 5 ]; then
              echo "pacman install failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((30 * attempt))
          done
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          # vcpkg reads curl 56 and 503 off github's archive host as permanent and
          # refuses to retry the source download, so retry the whole install
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install xerces-c:x64-windows openssl:x64-windows 'libxml2[tools]:x64-windows'
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }
        shell: pwsh

      - name: Set vcpkg env (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
          $installed = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          echo "$installed\tools\libxml2" >> $env:GITHUB_PATH
          echo "$installed\bin" >> $env:GITHUB_PATH

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup grok
        uses: PostPerfection/setup-grok@v1
        with:
          grok-ref: v20.4.6

      - name: Setup libmpv
        uses: PostPerfection/setup-libmpv@v1
        with:
          mpv-release: 20260828
          mpv-archive: mpv-dev-x86_64-20260828-git-182fa6ca49.7z

      - name: Check test tools
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          grk_compress -h > /dev/null
          grk_decompress -h > /dev/null
          xmllint --version
          xmlsec1 --version
          if [ "$RUNNER_OS" = Windows ]; then
            # no pkg-config for mpv there, build.rs reads this instead
            test -n "${MPV_LIB_DIR:-}"
          else
            pkg-config --modversion mpv
          fi

      - name: Build
        run: cargo build --features "async tms"

      - name: Test
        run: cargo test --no-fail-fast --features "async tms"

      - name: Clippy
        run: cargo clippy --all-targets --features "async tms" -- -D warnings

      - name: Build (grok-ffi)
        run: cargo build --features "${{ matrix.grok-features }}"

      - name: Test (grok-ffi)
        run: cargo test --no-fail-fast --features "${{ matrix.grok-features }}"

      - name: Clippy (grok-ffi)
        run: cargo clippy --all-targets --features "${{ matrix.grok-features }}" -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-deny

      # advisories left out because ttf-parser is unmaintained per RUSTSEC-2026-0192
      # with no safe upgrade, it comes in through cosmic-text then fontdb. don't add
      # an ignore, it hides the finding.
      - name: Cargo deny
        run: cargo deny check bans licenses sources
