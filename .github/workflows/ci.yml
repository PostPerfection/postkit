name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libxerces-c-dev xmlsec1 libxml2-utils ffmpeg

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl xerces-c
          echo "OPENSSL_DIR=$(brew --prefix openssl)" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$(brew --prefix xerces-c):$(brew --prefix openssl)" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          # vcpkg reads curl 56 and 503 off github's archive host as permanent and
          # refuses to retry the source download, so retry the whole install
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install xerces-c:x64-windows openssl:x64-windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }
        shell: pwsh

      - name: Set vcpkg env (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --features "async tms"

      - name: Test
        run: cargo test --features "async tms"

      - name: Clippy
        run: cargo clippy --all-targets --features "async tms" -- -D warnings

      - name: Setup grok
        if: runner.os != 'Windows'
        uses: PostPerfection/setup-grok@v1
        with:
          grok-ref: v20.4.0

      # grok-ffi links libgrokj2k (built above); skipped on windows where the
      # source build is not wired up.
      - name: Build (grok-ffi)
        if: runner.os != 'Windows'
        run: cargo build --features "async grok-ffi"

      - name: Test (grok-ffi)
        if: runner.os != 'Windows'
        run: cargo test --features "async grok-ffi"

      - name: Clippy (grok-ffi)
        if: runner.os != 'Windows'
        run: cargo clippy --all-targets --features "async grok-ffi" -- -D warnings

      - name: Format check
        run: cargo fmt -- --check
